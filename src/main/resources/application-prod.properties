# Baza danych produkcyjna
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/komornik}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
# Adresy produkcyjne
url=${APP_URL:https://komornik.uno}
frontend.url=${FRONTEND_URL:https://komornik.uno}
# Opcjonalny import pliku z zewnętrznymi kluczami (kompatybilność z serwerem prod)
spring.config.import=optional:file:/app/daneDoKontProd.properties
# Ciasteczka i bezpieczeństwo (wymóg HTTPS)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.partitioned=true
jwt.cookie.secure=true
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:komornik.uno}
# Port serwera
server.port=${SERVER_PORT:443}
# Konfiguracja SMTP dla produkcji
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:komornikapp@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Logowanie produkcyjne
logging.file.name=${LOGGING_FILE_NAME:/app/logs/app.log}
logging.level.org.springframework.security=info
logging.level.org.springframework.security.oauth2=info
logging.level.com.janis.komornikgpt.auth=info
# Monitoring Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
# WebAuthn / Passkeys
webauthn.rp-id=${WEBAUTHN_RP_ID:komornik.uno}

