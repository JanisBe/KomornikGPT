# Baza danych produkcyjna
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/komornik}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
# Adresy produkcyjne
url=${APP_URL:https://komornik.uno}
frontend.url=${FRONTEND_URL:https://komornik.uno}
# Opcjonalny import pliku z zewnętrznymi kluczami (kompatybilność z serwerem prod)
spring.config.import=optional:file:/app/daneDoKontProd.properties
# OAuth2 Client Credentials (zmienne środowiskowe lub daneDoKontProd.properties)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${social.auth.google.client-id:dummy-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${social.auth.google.client-secret:dummy-google-client-secret}}
spring.security.oauth2.client.registration.google.redirect-uri=${url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID:${social.auth.facebook.app-id:dummy-facebook-app-id}}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET:${social.auth.facebook.app-secret:dummy-facebook-app-secret}}
spring.security.oauth2.client.registration.facebook.redirect-uri=${url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:${social.auth.github.client-id:dummy-github-client-id}}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:${social.auth.github.client-secret:dummy-github-client-secret}}
spring.security.oauth2.client.registration.github.redirect-uri=${url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
# Ciasteczka i bezpieczeństwo (wymóg HTTPS)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.partitioned=true
jwt.cookie.secure=true
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:komornik.uno}
# Port serwera
server.port=${SERVER_PORT:443}
# Konfiguracja SMTP dla produkcji
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:komornikapp@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Logowanie produkcyjne
logging.file.name=${LOGGING_FILE_NAME:/app/logs/app.log}
logging.level.org.springframework.security=info
logging.level.org.springframework.security.oauth2=info
logging.level.com.janis.komornikgpt.auth=info
# Monitoring Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
# WebAuthn / Passkeys
webauthn.rp-id=${WEBAUTHN_RP_ID:komornik.uno}

