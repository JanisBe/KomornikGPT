# Domyślny aktywny profil
spring.profiles.active=local
# Baza danych (konfiguracja wspólna)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
# Flyway (domyślnie tylko oficjalne migracje)
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Logging
logging.level.org.springframework=info
logging.level.org.apache.tomcat=info
logging.file.name=logs/app.log

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=true
# JWT Configuration
jwt.secret=${JWT_SECRET:S1hwMnM1djh5L0JlRShIK01iUWVUaFdtWnE0dDZ3OXokQyZGKUpATmNSZlVqWG4ycjV1OHgvQSVEKkctS2FQZFM=}
jwt.cookie.expiration=${JWT_EXPIRATION:3600}
jwt.refresh.expirationMs=${JWT_REFRESH_EXPIRATION:604800000}
jwt.cookie.name=JWT_TOKEN
jwt.refresh.cookie.name=JWT_REFRESH_TOKEN
jwt.cookie.secure=false
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:}
# OAuth2 Client Credentials - provide via environment variables or .env file
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID:dummy-facebook-app-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET:dummy-facebook-app-secret}
spring.security.oauth2.client.registration.facebook.redirect-uri=${url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.redirect-uri=${url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
# OAuth2 Provider Endpoints
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
# Serwer i domyślne adresy URL
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
url=${APP_URL:http://localhost:8080}
frontend.url=${FRONTEND_URL:http://localhost:4200}